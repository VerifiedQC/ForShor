# Lightweight checks for efficient_tables/ (the classical table-optimization
# companion) and its site, docs/efficient-tables/. It deliberately does not
# build the Lean projects: those are separate Lake projects with their own
# toolchains (efficient_tables/REPRODUCING.md), the library is ~8k jobs, and
# lean_hardness compiles ~2.3k complexitylib modules. ForShor's main CI
# (ci.yml) does not touch this directory either.
name: efficient-tables

on:
  push:
    branches: [main]
    paths: ["efficient_tables/**", "docs/efficient-tables/**", ".github/workflows/efficient-tables.yml"]
  pull_request:
    paths: ["efficient_tables/**", "docs/efficient-tables/**", ".github/workflows/efficient-tables.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Proof-map graph is current and annotations validate
        # Regenerates docs/efficient-tables/data/graph.js, checks the layer
        # order and every curated edge/theorem in annotations.js, then fails
        # if the committed graph.js differs from the regenerated one.
        run: |
          python3 efficient_tables/scripts/gen_docs_graph.py --check
          git diff --exit-code docs/efficient-tables/data/graph.js

      - name: No sorry, axiom or native_decide in the Lean sources
        # The vendored contract is excluded only because one of its comments
        # mentions native_decide.
        run: |
          if grep -rnE "\bsorry\b|^\s*axiom\b|ofReduceBool|native_decide" \
               efficient_tables/lean efficient_tables/lean_hardness --include="*.lean" \
               --exclude-dir=vendor --exclude-dir=.lake; then
            echo "::error::found sorry/axiom/native_decide in efficient_tables"; exit 1
          fi
