# Everything a reviewer would otherwise have to remember to run by hand: the
# lake targets and the executables, a smoke run of each, the axiom
# guard, the lexical gate on each shipped template, and the docs graph.
#
# What this workflow does NOT do: apply the diff rule or the lexical gate as
# an acceptance control (Submission/README.md) -- this repository has no
# submission to police, so the gate runs here only to prove the published
# command still works.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push cancels the superseded build instead of letting
# two ~25-minute jobs stack up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Cold runs (empty cache) build the whole library from scratch; a warm run
    # is ~25 minutes, most of it EmitTests, which rebuilds whenever anything
    # under ShorVerification/ changes because Emit/Tests.lean imports Reference
    # and Submission.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        # Pinned: `releases/latest` would let a new elan change the toolchain
        # installer under the job with no commit in this repository.
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.0.0/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache .lake/packages
        # Dependency *sources* only. Caching all of `.lake` would restore this
        # project's own stale `.lake/build` on a hit, and save every Mathlib
        # olean on a miss (near GitHub's 10 GB cap). Mathlib's build comes from
        # `lake exe cache get`, which is what the next step is for.
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-

      - name: Fetch Mathlib build cache
        run: lake exe cache get

      - name: Build
        # Warnings are failures: the library is warning-free and stays so.
        # `-KwarningAsError=true` does not reach Lean's own linter warnings
        # (verified: a stray `unused variable` still builds green under it), so
        # the build log is grepped instead.
        run: |
          set -o pipefail
          lake build ForShor EmitTests Submission PolicySubmission PolicyTests Balanced \
            ForShor.ShorVerification.Model.Standard.Headline \
            ForShor.ShorVerification.Model.Standard.PhaseTripleProductHeadline \
            ForShor.ShorVerification.Model.QuantumLib.Headline 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "::error::build produced warnings:"
            grep "warning:" build.log
            exit 1
          fi

      - name: Build exact-width policy numerals
        # Kernel evaluations of the order-finding peaks under the `exact` width rule. Each module peaks at
        # 9-12 GB, so they are a library of their own (not in the `ForShor` umbrella), chained by import so that
        # Lake builds one at a time, and built here, after the main build, alone on the runner.
        run: |
          set -o pipefail
          lake build PolicyNumeralsExact 2>&1 | tee exact.log
          if grep -q "warning:" exact.log; then
            echo "::error::exact-width numerals produced warnings:"
            grep "warning:" exact.log
            exit 1
          fi

      - name: Build exact-width numerals of the board policies
        # The same, for the PhaseProduct board policies: five rows whose numerals fit a runner (at most
        # about 12 GB each). A step of its own; its first module imports the last one of the previous chain, so all
        # exact evaluations are one serial order. The four heaviest rows (13-15 GB) are
        # `PolicyNumeralsBoardExactHeavy`, local only.
        run: |
          set -o pipefail
          lake build PolicyNumeralsBoardExact 2>&1 | tee exact_board.log
          if grep -q "warning:" exact_board.log; then
            echo "::error::board exact-width numerals produced warnings:"
            grep "warning:" exact_board.log
            exit 1
          fi

      - name: Build executables
        # No executable is reachable from the library targets --
        # Emit/Tests.lean does not import Emit/Main.lean, Submission/Check.lean
        # does not import Submission/Main.lean, and PolicyCheck.lean does not
        # import PolicyMain.lean -- so without this they can stop compiling
        # without CI noticing.
        run: lake build forshor_emit forshor_submission forshor_policy_submission forshor_balanced_u

      - name: Smoke-run executables
        run: |
          lake exe forshor_emit 2 2 15 0 > /dev/null
          # The negation method is priced and printed: the default is the one-qubit method, and the
          # scratch method charges the same circuit differently (more clean qubits, fewer Toffolis).
          lake exe forshor_emit 2 2 15 0 | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["negation"]=="oneQubit", d["negation"]'
          lake exe forshor_emit 2 2 15 0 > /tmp/emit_one.json
          lake exe forshor_emit 2 2 15 0 --negation scratch > /tmp/emit_scratch.json
          python3 -c 'import json; a=json.load(open("/tmp/emit_one.json")); b=json.load(open("/tmp/emit_scratch.json")); assert a["negation"]=="oneQubit" and b["negation"]=="scratch"; assert a["circuit"]==b["circuit"], "negation method changed the circuit"; assert all(d["gate_count"]==sum(d["resources"][k] for k in ("h","x","cnot","toffoli","rz")) for d in (a,b)), "gate_count is not the total of the resources under the document'"'"'s own method"; assert a["resources"]!=b["resources"] and a["qubit_count"]!=b["qubit_count"], "scratch and oneQubit charge the same"; assert a["resources"]["cleanAnc"] < b["resources"]["cleanAnc"] and a["resources"]["toffoli"] > b["resources"]["toffoli"], "unexpected tradeoff"'
          lake exe forshor_submission | python3 -c 'import json,sys; json.load(sys.stdin)'
          # The policy names its negation method and the document carries the charge of each method:
          # the policy's own is the one it names, and the two differ (scratch: w+1 clean qubits, 2w-3
          # Toffolis; oneQubit: one qubit, about 12w Toffolis).
          lake exe forshor_policy_submission | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ir"] is not None, "policy submission printed no IR"; assert d["negation"] in ("oneQubit","scratch"), "policy submission names no negation method"; by=d["negate_charge_by_method"]; assert by[d["negation"]]==d["negate_charge"], "negate_charge is not that of the named method"; o=by["oneQubit"]["at_width"]["2048"]; s=by["scratch"]["at_width"]["2048"]; assert o!=s, "scratch and oneQubit charge a negation the same"; assert o["cleanAnc"]==1 and s["cleanAnc"]==2049, (o,s); assert s["x"]==3*2048-4 and s["toffoli"]==2*2048-3, s'
          lake exe forshor_policy_submission --balanced | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ir"] is not None and "balanced" in d, "balanced policy submission printed no IR"'
          lake exe forshor_balanced_u | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ir"] is not None and "balanced_unconditional" in d, "unconditional balanced submission printed no IR"'

      - name: Axiom guard
        # The README's claim that the headline theorems use only propext,
        # Classical.choice and Quot.sound, checked rather than asserted.
        run: lake env lean scripts/AxiomCheck.lean

      - name: Statement closure (PhaseTripleProduct)
        # Every constant the PTP claims reach must live in Mathlib/core, Framework/ or a
        # Statement.lean, so reading Statement.lean and Main.lean is enough to know what is claimed.
        run: lake env lean scripts/StatementClosure.lean

      - name: Lexical gate on the shipped templates
        # Proves the grep published in Submission/README.md still executes and
        # still passes on the example table and the example policy. Both
        # templates are submitter-owned files, so both are in scope for it.
        run: |
          bash scripts/check_template_lexical.sh ForShor/ShorVerification/Submission/Template.lean
          bash scripts/check_template_lexical.sh ForShor/ShorVerification/Submission/PolicyTemplate.lean

      - name: Check docs graph
        run: |
          python3 scripts/gen_docs_graph.py --check
          # A stale committed graph.js fails the job: the step above rewrites
          # it, so any diff means it was not regenerated with the change.
          git diff --exit-code docs/data/graph.js
